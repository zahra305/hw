<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="wizard">

        <div class="steps-bar">
            <div class="step completed">
                <div class="step-circle"><i class="fa fa-check"></i></div>
                <div class="step-title">Step</div>
                <div class="rectangle-icon">1</div>
            </div>

            <div class="step active">
                <div class="step-circle">2</div>
                <div>
                    <div class="step-title">Step </div>
                    <div class="step-title"> optional</div>
                </div>

                <div class="rectangle-icon">2</div>
            </div>
            <div class="step">
                <div class="step-circle">3</div>
                <div class="step-title">Step</div>
                <div class="rectangle-icon">3</div>
            </div>

            <div class="step hide">
            </div>


        </div>
        <div class="border-botten"></div>


        <div>
            <div class="steps-container" id="stepsContainer">

                <div class="step-content">
                    <div class="step-back">
                        <h3>Step 1</h3>
                        <p class="caption-step">1</p>
                    </div>
                    <div class="wizard-footer">
                        <button class="btn-next">NEXT</button>
                        <button class="btn-prev">PREVIOUS</button>

                    </div>
                </div>

                <div class="step-content">
                    <div class="step-back">
                        <h3>Step 2</h3>
                        <p class="caption-step">2</p>
                    </div>
                    <div class="wizard-footer">
                        <button class="btn-next">NEXT</button>
                        <button class="btn-prev">PREVIOUS</button>

                    </div>
                </div>

                <div class="step-content">
                    <div class="step-back">
                        <h3>Step 3</h3>
                        <p class="caption-step">3</p>
                    </div>
                    <div class="wizard-footer">
                        <button class="btn-next">NEXT</button>
                        <button class="btn-prev">PREVIOUS</button>

                    </div>
                </div>

                <div class="step-content">
                    <div class="step-back">
                        <h3> Finish </h3>
                        <p class="caption-step">4</p>
                    </div>
                    <div class="wizard-footer">
                        <button class="btn-Reset">Reset</button>


                    </div>
                </div>
            </div>



        </div>
    </div>
    <script src="index.js">
    </script>

</body>

</html>

</html>
