<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Movies</title>
  <link href="/src/style.css" rel="stylesheet">

</head>
<body class="bg-gray-100 p-8">

  <h1 class="text-center text-2xl font-bold mb-5">My Favorite Movies</h1>

 
  <form id="movie-form" class="mb-10 text-center">
    <input id="movie-name" type="text" placeholder="Movie Name" class="border p-2 rounded mr-2" required>
    <input id="movie-rate" type="number" step="0.1" min="0" max="10"  placeholder="Rate" class="border p-2 w-[150px]  rounded mr-2" required>
    <button type="submit" class="bg-blue-500 text-white p-2 rounded">Add Movie</button>
  </form>

  <table class="min-w-full bg-white shadow-md rounded-lg">
    <thead>
      <tr>
        <th id="name-header" class="px-4 py-2 bg-blue-200 border cursor-pointer">Name<i class="bi bi-chevron-double-down"></i></th>
        <th id="rate-header" class="px-4 py-2 bg-blue-200 border w-[150px] cursor-pointer">Rate<i class="bi bi-chevron-double-down"></i></th>
        <th class="px-4 py-2 bg-blue-200 w-[150px]">Action</th>
      </tr>
    </thead>
    <tbody id="movie-list">
     
    </tbody>
  </table>

  <script type="module" src="/src/main.ts"></script>
  
</body>
</html>
